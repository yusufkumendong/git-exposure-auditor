name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq python3 shellcheck

      - name: Bash syntax
        run: |
          bash -n install.sh bin/git-exposure-auditor lib/common.sh scripts/*.sh tests/*.sh

      - name: Python syntax
        run: |
          python3 -m py_compile lib/*.py tests/*.py

      - name: ShellCheck
        run: |
          shellcheck --severity=error install.sh bin/git-exposure-auditor lib/common.sh scripts/*.sh tests/*.sh

      - name: Local validation tests
        run: |
          ./tests/run-tests.sh
