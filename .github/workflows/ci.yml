name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq python3 shellcheck
      - name: ShellCheck
        run: shellcheck -S error -x bin/gea lib/*.sh scripts/*.sh tests/*.sh install.sh
      - name: Syntax
        run: ./tests/syntax.sh
      - name: Input tests
        run: ./tests/input.sh
      - name: Integration tests
        run: ./tests/integration.sh

  container-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:12-slim
          - almalinux:10
          - rockylinux:9
          - kalilinux/kali-rolling
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git and runtime
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y git bash curl jq python3 ca-certificates
          else
            dnf install -y git bash curl jq python3 ca-certificates
          fi
      - uses: actions/checkout@v4
      - name: Run tests
        shell: bash
        run: |
          ./tests/syntax.sh
          ./tests/input.sh
          ./tests/integration.sh
