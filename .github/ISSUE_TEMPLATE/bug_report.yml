name: Bug report
description: Report a reproducible problem in Git Exposure Auditor
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real third-party targets, credentials, secrets, personal data, or private program scope.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Kali Linux / Ubuntu / WSL
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use localhost or example.invalid fixtures.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
