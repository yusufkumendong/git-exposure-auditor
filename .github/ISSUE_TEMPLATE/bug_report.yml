name: Bug report
description: Report an issue in the toolkit without including real target data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include third-party secrets, credentials, personal data, or out-of-scope target information.
  - type: input
    id: script
    attributes:
      label: Affected script
      placeholder: scripts/best-practice.sh
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Kali Linux, Bash 5.x, httpx version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use safe example domains or a local test server.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed real secrets and unauthorized target information.
          required: true
