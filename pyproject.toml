[project]
name = "git-exposure-auditor"
version = "3.2.0rc2"
description = "Safe, adaptive, signature-aware .git exposure validator for authorized assets"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
